services:
  db:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cyonemu
      MYSQL_DATABASE: "cyon_2.9"
    command: >
      --character-set-server=latin1
      --collation-server=latin1_swedish_ci
      --default-storage-engine=MyISAM
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - "./CyonEmu 2.9/Emulateur/CyonDBFULL.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"
      - "./z-drops-override.sql:/docker-entrypoint-initdb.d/02-drops-override.sql:ro"
      - "./z-dungeon-fixes.sql:/docker-entrypoint-initdb.d/03-dungeon-fixes.sql:ro"
      - "./z-xp-curve.sql:/docker-entrypoint-initdb.d/04-xp-curve.sql:ro"
      - "./z-spell-scrolls.sql:/docker-entrypoint-initdb.d/05-spell-scrolls.sql:ro"
      - "./z-vip-all.sql:/docker-entrypoint-initdb.d/05-vip-all.sql:ro"
      - "./z-gm-shops.sql:/docker-entrypoint-initdb.d/06-gm-shops.sql:ro"
      - "./z-profession-learners.sql:/docker-entrypoint-initdb.d/07-profession-learners.sql:ro"
      - "./z-consumable-fixes.sql:/docker-entrypoint-initdb.d/08-consumable-fixes.sql:ro"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcyonemu"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ./docker/server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "4444:4444"
      - "5555:5555"
    volumes:
      - "./config/CyonConfig.txt:/app/CyonConfig.txt:ro"
      - "./CyonEmu 2.9/Emulateur/CyonEmu.jar:/app/CyonEmu.jar:ro"

  gamedata:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8880:80"
    volumes:
      - "./dofus/lang:/usr/share/nginx/html/game/lang:ro"
      - "./dofus/maps:/usr/share/nginx/html/game/maps:ro"

  register:
    build:
      context: ./registration
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: cyonemu
      DB_NAME: "cyon_2.9"
    ports:
      - "8881:80"

volumes:
  mysql-data:
